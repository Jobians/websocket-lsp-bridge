name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ws-lsp-bridge/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/ws-lsp-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Configure Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
          else
            echo "Installing NDK manually..."
            NDK_VERSION=r27c
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
            unzip -q "android-ndk-${NDK_VERSION}-linux.zip" -d "$HOME"
            echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Build release binary
        working-directory: packages/ws-lsp-bridge
        run: |
          cargo ndk \
            --target ${{ matrix.target }} \
            --platform 21 \
            -- build --release

      - name: Package binary
        working-directory: packages/ws-lsp-bridge
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/wslsp"
          ARCHIVE="wslsp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY_PATH")" wslsp
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wslsp-${{ matrix.target }}
          path: |
            packages/ws-lsp-bridge/wslsp-*.tar.gz
            packages/ws-lsp-bridge/wslsp-*.tar.gz.sha256

  build-musl:
    name: Build Linux Musl (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ws-lsp-bridge/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/ws-lsp-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        working-directory: packages/ws-lsp-bridge
        run: cross build --target ${{ matrix.target }} --release

      - name: Package binary
        working-directory: packages/ws-lsp-bridge
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/wslsp"
          ARCHIVE="wslsp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY_PATH")" wslsp
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wslsp-${{ matrix.target }}
          path: |
            packages/ws-lsp-bridge/wslsp-*.tar.gz
            packages/ws-lsp-bridge/wslsp-*.tar.gz.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-musl]

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
