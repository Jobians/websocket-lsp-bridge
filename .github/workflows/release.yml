name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch_label: aarch64
          - target: armv7-linux-androideabi
            arch_label: armv7

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ws-lsp-bridge/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/ws-lsp-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cargo-ndk and Android NDK
        run: |
          cargo install cargo-ndk
          # Install the NDK via the Android SDK manager
          sudo apt-get install -y wget unzip
          NDK_VERSION=r27c
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip" -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Add Android target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        working-directory: packages/ws-lsp-bridge
        run: |
          cargo ndk \
            --target ${{ matrix.target }} \
            --platform 21 \
            -- build --release

      - name: Package binary
        working-directory: packages/ws-lsp-bridge
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/wslsp"
          ARCHIVE="wslsp-${{ github.ref_name }}-${{ matrix.arch_label }}.tar.gz"

          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY_PATH")" wslsp
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wslsp-${{ matrix.arch_label }}
          path: |
            packages/ws-lsp-bridge/wslsp-*.tar.gz
            packages/ws-lsp-bridge/wslsp-*.tar.gz.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
